name: Validate theme

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Theme package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes imagemagick librsvg2-bin shellcheck python3

      - name: Run ShellCheck
        run: shellcheck tests/validate-theme.sh

      - name: Validate theme package
        run: bash tests/validate-theme.sh
